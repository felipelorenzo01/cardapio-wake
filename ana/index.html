<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#382a29">
<title>Aniversário da Ana · Wake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Grand+Hotel&display=swap" rel="stylesheet">
<style>
  :root{
    --espresso:#382A29;
    --cream:#F8F4EE;
    --brown:#645A4E;
    --sand:#C5B59E;
    --sand-tint:#EDE4D5;   /* sand over cream, for chip/pill fills */
    --line:#E4DAC9;        /* warm hairline */
    --display:"Baloo 2",system-ui,sans-serif;
    --sans:"Nunito Sans",system-ui,-apple-system,sans-serif;
    --script:"Grand Hotel",cursive;
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}

  body{
    background:var(--cream);
    color:var(--espresso);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }

  .wrap{
    position:relative;
    max-width:460px;
    margin:0 auto;
    padding:0 26px 40px;
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    padding:52px 0 38px;
    text-align:center;
  }
  .hero::before{ /* soft warm respiro */
    content:"";
    position:absolute;
    top:-30px;left:50%;
    transform:translateX(-50%);
    width:540px;height:340px;
    background:radial-gradient(ellipse at center top, rgba(197,181,158,.45), rgba(197,181,158,0) 64%);
    pointer-events:none;
    z-index:-1;
  }

  .logo{
    height:32px;width:auto;display:block;
    margin:0 auto 30px;
  }

  .eyebrow{
    font-family:var(--sans);
    font-size:11px;
    font-weight:700;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--brown);
    display:inline-block;
  }
  .eyebrow::before,.eyebrow::after{
    content:"";
    display:inline-block;
    width:20px;height:1.5px;border-radius:2px;
    background:var(--sand);
    vertical-align:middle;
    margin:0 12px 3px;
  }

  .name{
    font-family:var(--display);
    font-weight:700;
    font-size:clamp(58px,20vw,86px);
    line-height:.94;
    color:var(--espresso);
    margin:12px 0 0;
  }

  .welcome{
    font-size:15px;
    color:var(--brown);
    max-width:320px;
    margin:16px auto 0;
  }

  .howto{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:24px;
    padding:10px 18px;
    border-radius:100px;
    background:var(--espresso);
    color:var(--cream);
    font-size:12px;
    font-weight:700;
    letter-spacing:.04em;
  }
  .howto b{color:var(--sand);font-weight:800;}

  /* ---------- SECTIONS ---------- */
  .section{padding-top:38px;}

  .sec-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    padding-bottom:12px;
    border-bottom:1.5px solid var(--line);
  }
  .sec-title{
    font-family:var(--display);
    font-weight:700;
    font-size:26px;
    line-height:1;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .sec-index{color:var(--sand);}
  .pick{
    flex:none;
    font-family:var(--sans);
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--brown);
    background:var(--sand-tint);
    padding:6px 11px;
    border-radius:100px;
    transform:translateY(-2px);
  }

  ul.items{list-style:none;}

  .item{
    position:relative;
    display:block;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    padding:17px 40px 17px 2px;
    font-family:inherit;
    color:inherit;
    cursor:pointer;
    transition:background .22s ease, padding .22s ease;
  }
  .item:last-child{border-bottom:none;}

  .item-name{
    font-family:var(--display);
    font-weight:600;
    font-size:20px;
    line-height:1.15;
    color:var(--espresso);
  }
  .item-desc{
    font-size:13.5px;
    line-height:1.45;
    color:var(--brown);
    margin-top:3px;
    max-width:33ch;
  }

  /* recheio / proteína chips */
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;align-items:center;}
  .chip{
    font-size:12px;
    font-weight:600;
    color:var(--espresso);
    background:var(--sand-tint);
    border:1px solid var(--sand);
    padding:4px 11px;
    border-radius:100px;
  }
  .chip-label{
    font-size:10px;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--brown);
    margin-right:2px;
  }

  /* selectable state (marca opcional, local) */
  .tick{
    position:absolute;
    top:19px;right:4px;
    width:22px;height:22px;
    border:1.5px solid var(--sand);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .2s ease, background .2s ease;
  }
  .tick svg{width:12px;height:12px;opacity:0;transform:scale(.5);transition:opacity .2s ease, transform .2s ease;}

  .item.selected{
    background:var(--sand-tint);
    padding-left:15px;
    border-radius:12px;
    box-shadow:inset 3px 0 0 var(--espresso);
  }
  .item.selected .tick{background:var(--espresso);border-color:var(--espresso);}
  .item.selected .tick svg{opacity:1;transform:scale(1);}
  .item.selected + .item{border-top:none;}

  /* ---------- FOOTER ---------- */
  .footer{
    margin-top:46px;
    background:var(--espresso);
    border-radius:22px;
    padding:36px 26px 34px;
    text-align:center;
  }
  .footer .logo{height:26px;margin:0 auto 18px;}
  .footer .tag{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--cream);
    opacity:.72;
  }
  .footer .rule{
    width:44px;height:1.5px;border-radius:2px;
    background:var(--sand);
    margin:20px auto;
    opacity:.7;
  }
  .footer .wish{
    font-family:var(--script);
    font-size:30px;
    line-height:1;
    color:var(--sand);
  }

  /* entrance */
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .reveal{opacity:0;animation:rise .7s ease forwards;}
  .d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.28s}
  .d4{animation-delay:.4s}.d5{animation-delay:.5s}.d6{animation-delay:.6s}

  @media (prefers-reduced-motion:reduce){
    .reveal{animation:none;opacity:1;}
    .item,.tick,.tick svg{transition:none;}
  }
</style>
</head>

<script>
  // Marca opcional: toca num item pra lembrar sua escolha (1 por seção).
  // Nada é enviado — é só um lembrete visual pra pedir na hora.
  document.querySelectorAll('.section').forEach(function(section){
    section.querySelectorAll('.item').forEach(function(btn){
      btn.addEventListener('click', function(){
        var already = btn.classList.contains('selected');
        section.querySelectorAll('.item').forEach(function(b){ b.classList.remove('selected'); });
        if(!already){ btn.classList.add('selected'); }
      });
    });
  });
</script>
